<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시크 추격전</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0607;--ink:#e9d7b0;--gold:#d4a84a;--blood:#8a1a28;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0607}}
:root[data-theme="dark"]{--bg:#0b0607}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:700;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas:active{cursor:grabbing}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(5,2,3,.84);padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#ov.off{display:none}
h1{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:900;font-size:clamp(44px,12vw,96px);margin:0 0 8px;color:var(--gold);text-shadow:0 0 28px rgba(212,168,74,.35)}
p{max-width:36ch;line-height:1.7;margin:6px 0;color:#cdb98f}
.k{font-size:14px;color:#8d7c5d;margin-top:14px}
button{margin-top:22px;background:transparent;color:var(--gold);border:1px solid var(--gold);padding:12px 30px;font:inherit;font-size:18px;cursor:pointer;border-radius:2px}
button:hover,button:focus-visible{background:var(--gold);color:#140a0a;outline:none}
#re{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0;padding:8px 16px;font-size:14px;background:rgba(5,2,3,.6)}
#bk{left:auto;right:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="bk">뒤돌아보기 (꾹)</button>
<div id="ov"><h1 id="t">시크 추격전</h1><p id="d">복도는 길고, 눈은 하나뿐이다. 불이 꺼지기 전에 끝의 문까지 달려라.</p><p class="k" id="k">이동: ← → / A D · 시점: 드래그 또는 Q E (R: 정면) · X 꾹: 뒤돌아보기<br>모바일: 화면 좌우를 꾹 누르면 이동, 드래그는 시점 회전</p><button id="b">달리기 시작</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,F,dpr;
function rs(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);F=Math.min(W*.9,H*1.25)}
addEventListener('resize',rs);rs();
const END=6225,S=3,N=46,BK=22,HW=4,HT=4,CW=1.4,DE=[-3.5,-1.1667,1.1667,3.5],SURGE=Array.from({length:3},(_,i)=>260+i*2400),NR=.25,VIS=60,EW=9.4;
let st='ready',z=0,seekZ=-48,lane=0,px=0,slow=0,shake=0,flash=0,t=0,obs=[],hb=0,camX=0,time=0,msgT=0,msgS='',gap=48;
let yaw=0,pitch=0,cY=1,sY=0,cP=1,sP=0,bo=0,bkBtn=false,sk=1,eo=1,ti=0,mvk={l:0,r:0},vx=0,blk=0,fkN=0,fkG=0,doors=[],tr=0,bk2=false,te=0,eq=0,wh=0,scr=-1,scrT=15,hc=0,inv=0,fwp=[],fwT=0,ss=0,poolR=0,poolZ=0,skS=1,skC=0,skH=1,skG=1,skP=0,pa=0;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
/* camera: world-relative (x,y,zr) -> camera space, with yaw/pitch */
function V(x,y,zr){const dx=x-camX,dy=y-1.55,x1=dx*cY-zr*sY,z1=dx*sY+zr*cY;return[x1,dy*cP-z1*sP,dy*sP+z1*cP]}
function S2(x,y,zr){const v=V(x,y,zr);if(v[2]<NR)return null;return{x:W/2+v[0]/v[2]*F,y:H*.52-v[1]/v[2]*F,u:F/v[2],d:v[2]}}
function Q(pts,col){const a=pts.map(p=>V(p[0],p[1],p[2])),o=[];
 for(let i=0;i<a.length;i++){const p=a[i],q=a[(i+1)%a.length],pi=p[2]>=NR,qi=q[2]>=NR;if(pi)o.push(p);
  if(pi!==qi){const k=(NR-p[2])/(q[2]-p[2]);o.push([p[0]+(q[0]-p[0])*k,p[1]+(q[1]-p[1])*k,NR])}}
 if(o.length<3)return;ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<o.length;i++){const x=W/2+o[i][0]/o[i][2]*F,y=H*.52-o[i][1]/o[i][2]*F;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.fill()}
const fl=(y,x0,x1,a,b,c)=>Q([[x0,y,a],[x1,y,a],[x1,y,b],[x0,y,b]],c);
const wl=(x,y0,y1,a,b,c)=>Q([[x,y0,a],[x,y1,a],[x,y1,b],[x,y0,b]],c);
const sh=(c,k)=>{k=cl(k);return`rgb(${c[0]*k|0},${c[1]*k|0},${c[2]*k|0})`};
function say(s,d=2.4){msgS=s;msgT=d}
function gen(){obs=[];let g=70,pf=0;while(g<END-50){const p=g/END,w=2,free=pf=cl(pf+(Math.random()*3|0)-1,-2,2-w);const ls=[-2,-1,0,1,2].filter(l=>l<free||l>=free+w);for(const l of ls){obs.push({z:g,l,type:Math.random()<.5?'c':'h',p:0,hit:false})}g+=25-p*6+Math.random()*7}doors=[];let zz=0,tt=0,kk=1;while(zz<END-60){zz+=(32+19*cl(tt/150))*.02;tt+=.02;if(tt>=10*kk){const cx=Math.random()*4-2;doors.push({z:zz,cx,x0:cx-1.7<-3.3?-HW:cx-1.7,x1:cx+1.7>3.3?HW:cx+1.7,p:1,on:true,s:0,q:0,c:0});obs=obs.filter(o=>Math.abs(o.z-zz)>26);kk++}}}
function reset(){z=0;seekZ=-48;lane=0;px=0;vx=0;mvk.l=mvk.r=0;blk=fkN=0;tr=0;eq=0;wh=0;hc=0;inv=0;ss=0;poolR=0;scr=-1;scrT=12+Math.random()*6;slow=0;shake=0;flash=0;t=0;hb=0;time=0;camX=0;msgT=0;gap=48;gen()}
/* audio */
let ac,dr;
function aud(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type='sawtooth';o.frequency.value=46;f.type='lowpass';f.frequency.value=150;g.gain.value=0;o.connect(f);f.connect(g);g.connect(ac.destination);o.start();dr={g};music()}catch(e){}}
function thump(v=.5,fr=62){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(fr,ac.currentTime);o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+.18);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.25)}catch(e){}}
function crash(){if(!ac)return;try{const b=ac.createBuffer(1,ac.sampleRate*.4,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=.5;s.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
/* world */
function lampOn(i){if(i*12<seekZ+4)return 0;const h=((i*9301+49297)%233280)/233280;if((gap<34||(st==='intro'&&ti>.4))&&(((t*7+i)|0)%6===0)&&h<.55)return 0;return 1}
function light(zz){const i=Math.round(zz/12),d=Math.abs(zz-i*12)/6;return lampOn(i)*Math.max(0,1-d)}
function door(x,a,b,k){a+=.2;b-=.2;wl(x,0,2.75,a-.06,b+.06,sh([130,98,44],k));wl(x,0,2.62,a,b,sh([46,26,20],k));const s=S2(x,1.1,b-.4);if(s){ctx.fillStyle=sh([212,168,74],k);ctx.beginPath();ctx.arc(s.x,s.y,Math.max(1,.07*s.u),0,7);ctx.fill()}}
function chand(x,zr,f){const y=3.9-3.45*f*f,s=S2(x,y,zr);if(!s||s.d<.5)return;const u=s.u;
 if(f<1){const tp=S2(x,HT,zr);if(tp){ctx.strokeStyle='#5a4520';ctx.lineWidth=Math.max(1,.05*u);ctx.beginPath();ctx.moveTo(tp.x,tp.y);ctx.lineTo(s.x,s.y);ctx.stroke()}}
 const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,.95*u);g.addColorStop(0,'rgba(255,220,140,.4)');g.addColorStop(1,'rgba(255,220,140,0)');ctx.fillStyle=g;ctx.fillRect(s.x-u,s.y-u,2*u,2*u);
 ctx.fillStyle='#4a3816';ctx.beginPath();ctx.ellipse(s.x,s.y,.6*u,.28*u,0,0,7);ctx.fill();
 for(let i=0;i<7;i++){const a=i/7*6.283,ex=s.x+Math.cos(a)*.52*u,ey=s.y+Math.sin(a)*.17*u-.14*u;ctx.fillStyle='#b08e46';ctx.beginPath();ctx.arc(ex,ey,.07*u,0,7);ctx.fill();ctx.fillStyle='#d9c68a';ctx.fillRect(ex-.015*u,ey-.2*u,.03*u,.14*u)}
 if(f>=1){ctx.fillStyle='rgba(255,235,190,.45)';for(let i=0;i<9;i++){const a=i*2.1,r=(.6+(i%4)*.18)*u,qx=s.x+Math.cos(a)*r,qy=s.y+.22*u+Math.sin(a)*.1*u;ctx.beginPath();ctx.moveTo(qx,qy);ctx.lineTo(qx+.07*u,qy+.02*u);ctx.lineTo(qx+.02*u,qy-.06*u);ctx.fill()}}}
function hand(x,zr,h){const s=S2(x,0,zr);if(!s||s.d<.5)return;const u=s.u,ph=1.05*h*u;ctx.fillStyle=ctx.strokeStyle='#060409';ctx.lineCap='round';
 ctx.beginPath();ctx.ellipse(s.x,s.y,.7*u,.2*u,0,0,7);ctx.fill();
 ctx.lineWidth=.5*u;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,s.y-ph);ctx.stroke();
 ctx.beginPath();ctx.ellipse(s.x,s.y-ph,.4*u,.3*u,0,0,7);ctx.fill();
 ctx.lineWidth=.11*u;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(s.x+i*.12*u,s.y-ph);ctx.quadraticCurveTo(s.x+i*.3*u,s.y-ph-.5*u*h,s.x+i*.4*u+Math.sin(t*4+i)*.05*u,s.y-ph-.9*u*h);ctx.stroke()}
 ctx.strokeStyle='rgba(140,30,50,.55)';ctx.lineWidth=Math.max(1,.015*u);ctx.beginPath();ctx.ellipse(s.x,s.y,.7*u,.2*u,0,0,7);ctx.stroke()}
function eye(cx,cy,r,look,o=1){o=Math.max(.04,o);ctx.fillStyle='#f3efe6';ctx.beginPath();ctx.ellipse(cx,cy,r,r*.62*o,0,0,7);ctx.fill();
 ctx.fillStyle='#050305';ctx.beginPath();ctx.ellipse(cx+look*r*.25,cy,r*.34*Math.min(1,o*1.6),r*.34*Math.min(1,o*1.6),0,0,7);ctx.fill();
 ctx.strokeStyle='#050305';ctx.lineWidth=Math.max(1,r*.12);ctx.beginPath();ctx.ellipse(cx,cy,r,r*.62*o,0,0,7);ctx.stroke()}
/* Seek, in the world behind the player */
const BODY='#02040b',BLUE='rgba(100,155,255,.9)';
function seekFig(zr){const fp=S2(0,0,zr);if(!fp||fp.d<.6||ss>=1||sk<=0)return;
 const sc=skS,cr=skC,u=fp.u,bx=fp.x,by=fp.y,am=skG,gp=skP,lp=(a,b,k)=>a+(b-a)*k,sink=ss*4.8*sc,ow=Math.max(1.4,.026*sc*u);
 const X=x=>bx+x*sc*u,Y=y=>by-(y*sc-sink)*u;
 const bob=Math.abs(Math.sin(gp))*.08*am*(1-cr),hip=lp(1.9,1,cr)+bob,sho=hip+lp(1.35,.85,cr),head=sho+lp(.62,.18,cr);
 const HS=[];for(const s of[-1,1]){const ph=gp+(s>0?Math.PI:0);HS.push([s*lp(.52+Math.sin(ph)*.05*am,.85,cr),lp(hip*.2+Math.sin(ph)*.25*am,.06,cr),s])}
 ctx.save();if(ss>0){ctx.beginPath();ctx.rect(0,0,W,by+1);ctx.clip()}
 ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=1;
 const pass=(col,e)=>{ctx.strokeStyle=ctx.fillStyle=col;
  for(const s of[-1,1]){const ph=gp+(s>0?0:Math.PI),lift=Math.max(0,Math.sin(ph))*.32*am*(1-cr),fx=s*lp(.2,.6,cr)+Math.sin(ph)*.1*am*(1-cr);
   ctx.lineWidth=.15*sc*u+e;ctx.beginPath();ctx.moveTo(X(s*.14),Y(hip));ctx.quadraticCurveTo(X(s*lp(.24,.65,cr)),Y(hip*.5+lift*.5),X(fx),Y(lift));ctx.stroke()}
  ctx.lineWidth=Math.max(.01,e);ctx.beginPath();ctx.moveTo(X(-.34),Y(sho));ctx.quadraticCurveTo(X(-.26),Y((sho+hip)/2),X(-.16),Y(hip-.1));ctx.lineTo(X(.16),Y(hip-.1));ctx.quadraticCurveTo(X(.26),Y((sho+hip)/2),X(.34),Y(sho));ctx.quadraticCurveTo(X(0),Y(sho+.14),X(-.34),Y(sho));ctx.fill();if(e)ctx.stroke();
  ctx.lineWidth=.1*sc*u+e;ctx.beginPath();ctx.moveTo(X(0),Y(sho));ctx.lineTo(X(0),Y(head-.2));ctx.stroke();
  for(const[hx,hy,s]of HS){ctx.lineWidth=.1*sc*u+e;ctx.beginPath();ctx.moveTo(X(s*.34),Y(sho-.05));ctx.quadraticCurveTo(X(s*lp(.62,.9,cr)),Y((sho+hy)/2),X(hx),Y(hy+.08));ctx.stroke();
   ctx.beginPath();ctx.ellipse(X(hx),Y(hy+.08),.1*sc*u+e/2,.08*sc*u+e/2,0,0,7);ctx.fill();
   for(let i=-2;i<=2;i++){const fl=lp(1,1.15,cr)*(1-.1*Math.abs(i)),sp=lp(.08,.24,cr);ctx.lineWidth=.045*sc*u+e;ctx.beginPath();ctx.moveTo(X(hx+i*.03),Y(hy+.06));ctx.quadraticCurveTo(X(hx+i*sp*.6+s*.03),Y(hy-fl*.45+.05),X(hx+i*sp+Math.sin(t*5+i)*.025),Y(Math.max(0,hy-fl)));ctx.stroke()}}
  ctx.beginPath();ctx.ellipse(X(0),Y(head),.3*sc*u+e/2,.5*sc*u+e/2,0,0,7);ctx.fill()};
 pass(BLUE,ow*2);pass(BODY,0);
 const ex=X(0),ey=Y(head+.04),o=Math.max(.04,eo),rx=.26*sc*u,ry=.24*sc*u*o,oo=Math.min(1,o*1.5),lk=Math.sin(t*2)*.12+Math.sin(yaw)*.2,pr=.12*sc*u;
 ctx.fillStyle='#e8e4da';ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,0,0,7);ctx.fill();
 ctx.strokeStyle='rgba(120,30,40,.5)';ctx.lineWidth=Math.max(1,.012*sc*u);for(let i=0;i<8;i++){const a=i/8*6.283+.3;ctx.beginPath();ctx.moveTo(ex+Math.cos(a)*rx*.95,ey+Math.sin(a)*ry*.95);ctx.lineTo(ex+Math.cos(a)*rx*.45,ey+Math.sin(a)*ry*.45);ctx.stroke()}
 ctx.fillStyle='#3a1020';ctx.beginPath();ctx.ellipse(ex+lk*rx,ey,pr*1.35,pr*1.35*oo,0,0,7);ctx.fill();
 ctx.fillStyle=BODY;ctx.beginPath();ctx.ellipse(ex+lk*rx*1.1,ey,pr*.75,pr*.75*oo,0,0,7);ctx.fill();
 ctx.strokeStyle=BLUE;ctx.lineWidth=Math.max(1,ow);ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,0,0,7);ctx.stroke();
 ctx.restore()}
function punchArm(p){if(p<=.01)return;
 const z0=seekZ-z,e=p*p*(3-2*p),hz=z0+6+(-9.5-(z0+6))*e,hx=-3.65,hy=1.7,ex=(-.4+hx)/2+.8,ey=(3+hy)/2+.5,ez=(z0+hz)/2,pts=[];
 for(let i=0;i<=16;i++){const k=i/16,a=1-k;pts.push(S2(a*a*-.4+2*a*k*ex+k*k*hx,a*a*3+2*a*k*ey+k*k*hy,a*a*z0+2*a*k*ez+k*k*hz))}
 if(pts.some(q=>!q))return;
 const h=pts[16],u=h.u;ctx.save();ctx.globalAlpha=1;ctx.lineCap='round';
 for(const[col,x2]of[[BLUE,2.4],[BODY,0]]){ctx.strokeStyle=ctx.fillStyle=col;
  for(let i=0;i<16;i++){const q=pts[i],r=pts[i+1];ctx.lineWidth=(.1+.1*i/16)*(q.u+r.u)/2+x2;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(r.x,r.y);ctx.stroke()}
  ctx.beginPath();ctx.ellipse(h.x,h.y,.2*u+x2/2,.16*u+x2/2,0,0,7);ctx.fill();
  for(let i=-2;i<=2;i++){const a=-1.75+i*.5+Math.sin(t*6+i)*.03,L=1.5*u*(1-.15*Math.abs(i));ctx.lineWidth=.07*u+x2;ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.quadraticCurveTo(h.x+Math.cos(a)*L*.5,h.y+Math.sin(a)*L*.5+.1*u,h.x+Math.cos(a)*L,h.y+Math.sin(a)*L);ctx.stroke()}}
 ctx.restore()}
function drawPool(zr,R){const pts=[];for(let i=0;i<28;i++){const a=i/28*6.283,p=S2(Math.cos(a)*R,0,zr+Math.sin(a)*R);if(!p)return;pts.push(p)}
 ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle='#010001';ctx.fill();ctx.strokeStyle='rgba(120,30,45,.45)';ctx.lineWidth=2;ctx.stroke()}
function rear(){const R=Math.min(70,W*.14),cx=W-R-14,cy=R+14;ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
 const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);g.addColorStop(0,'#2a1214');g.addColorStop(1,'#080304');ctx.fillStyle=g;ctx.fillRect(cx-R,cy-R,2*R,2*R);
 const e=cl(1-gap/70,.04,1);ctx.fillStyle='#030204';ctx.beginPath();ctx.ellipse(cx,cy+R*.3,R*1.1*e+4,R*1.4*e+4,0,0,7);ctx.fill();
 if(gap<70)eye(cx,cy-R*.15*e,R*.75*e+2,Math.sin(t*2));
 ctx.restore();ctx.strokeStyle='#d4a84a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke()}
function start(){reset();st='intro';ti=0;sk=0;eo=0;bo=Math.PI;yaw=0;pitch=0;intro.r=0;intro.h=0;pa=0;ov.classList.add('off');aud();if(ac&&ac.state==='suspended')ac.resume();say('...뭔가 다가온다',2.2)}
function die(){st='dead';thump(1,50);crash();document.getElementById('t').textContent='붙잡혔다';document.getElementById('d').textContent=`${Math.min(1500,(tr*1500/150)|0)}m / 1500m 지점에서 눈이 당신을 삼켰다.`;document.getElementById('k').textContent='장애물 사이의 길로 빠져나가라.';document.getElementById('b').textContent='다시 도전';ov.classList.remove('off')}
function win(){st='win';document.getElementById('t').textContent='탈출';document.getElementById('d').textContent=`문이 닫혔다. 뒤에서 울부짖는 소리가 멀어진다. 기록 ${time.toFixed(1)}초.`;document.getElementById('k').textContent='';document.getElementById('b').textContent='한 번 더';ov.classList.remove('off')}
function hit(){seekZ+=24;shake=.8;flash=1;crash();thump(1,70);inv=1;slow=.75;say('시크가 바짝 따라붙었다!',1.2)}
function step(dt){t+=dt;time+=dt;
 const base=32+19*cl(tr/150);bk2=false;z+=base*(slow>0?.1:1)*dt;slow-=dt;inv-=dt;
 for(const d of doors){const zr=d.z-z;if(!d.c&&zr<62){d.c=1;thump(.6,70);say('벽이 열린다!',1.6)}if(d.c)d.q=Math.min(1,d.q+dt*1.2);if(d.on&&zr<.8&&zr>-.6){const lo=d.x0-.2,hi=d.x1+.2;if(px<lo||px>hi||d.q<.5){z=d.z-.8;bk2=true;if(!d.s){d.s=1;shake=.5;crash();thump(.8,60);say('벽에 막혔다!',1.2)}}}}
